<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Video–World · Interactive research timeline</title>
  <link rel="stylesheet" href="reader.css?v=20261016-clean2">
  <script src="reader.js?v=20261016-clean2" defer></script>
</head>
<body>
  <header class="reader-toolbar">
    <div class="reader-controls">
      <div class="zoom-controls" role="group" aria-label="Timeline zoom"><button id="zoom-out" type="button" aria-label="Zoom out">−</button><output id="zoom-level" aria-live="polite">Fit</output><button id="zoom-in" type="button" aria-label="Zoom in">+</button><button id="fit-width" type="button" aria-label="Fit timeline to width">Fit</button></div>
      <select id="year" aria-label="Jump to year"><option value="0">All years</option><option value="2017">2017–2020</option><option>2021</option><option>2022</option><option>2023</option><option>2024</option><option>2025</option><option>2026</option><option value="world">Video ↔ World</option></select>
    </div>
    <nav class="path-controls" aria-label="Focus a research direction">
      <button type="button" data-path="all" aria-pressed="true">All</button>
      <button type="button" data-path="reading" aria-pressed="false">Reading</button>
      <button type="button" data-path="writing" aria-pressed="false">Writing</button>
      <button type="button" data-path="sharing" aria-pressed="false">Sharing</button>
      <button type="button" data-path="world_model" aria-pressed="false">Interacting</button>
    </nav>
  </header>
  <main id="viewport" tabindex="0" aria-label="Interactive timeline. Scroll to explore. Plus and minus zoom; zero fits the width.">
    <div id="sheet"><!-- TIMELINE_ART --></div>
  </main>
</body>
</html>
